name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The plugin's own suite: stdlib unittest, no Rust binary, no third-party package. The
  # wire-vocabulary contract test reads the engine's docs, named with AFZ_DOCS.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: DustinEwan/autofuzz
          path: .engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Tests
        run: AFZ_DOCS=$GITHUB_WORKSPACE/.engine/docs python3 -m unittest discover -s test -t .

  # The conformance gate, run through the product command rather than a bespoke harness:
  # `afz install-harness` drives the suite and prints the report.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install afz
        run: cargo install --git https://github.com/DustinEwan/autofuzz.git afz-cli --locked

      - name: Validate
        run: afz install-harness "$GITHUB_WORKSPACE" --json > report.json

      # The mechanism's own conformance check: prpc-core spawns `python3 src/server.py` and runs
      # the six wire rules (spawn, protocol-version, handshake-schema, unknown-method,
      # framing-intact, process-alive), then runs the profile's suite program - `afz
      # validate-harness` - and prints the profile's rules after the wire rules. The profile spec
      # and the schemas it names come from a shallow clone of the engine rather than a copy in
      # this repository, because a copy would drift from the engine this plugin is validated
      # against. The runner runs from this workspace because the suite program resolves the
      # manifest's relative paths, and the emitter, beside the directory it was started in. It
      # exits non-zero on any violation or suite error, so a broken wire contract fails this job.
      - name: Wire conformance
        run: |
          cargo install plugin-rpc --bin prpc-core --version 0.1.0-alpha.8 --locked
          git clone --depth 1 https://github.com/DustinEwan/autofuzz.git "$RUNNER_TEMP/afz-engine"
          prpc-core "$RUNNER_TEMP/afz-engine/afz-1.profile.json" ./afz-harness.json --suite

      # The goldens this repository publishes: zero violations, all twelve template
      # properties pass, and the fixture validator passes all seven fixture-shaped ids. A
      # deleted or gutted validator fails the second assertion.
      - name: Assert the report
        run: |
          jq -e '((.violations | length) == 0)
                 and ((.template.properties | map(select(.verdict == "not-applicable")) | length) == 0)
                 and ((.template.properties | map(select(.verdict == "pass")) | length) == 12)' report.json
          jq -e '(.validator.properties | map(select(.verdict == "pass")) | length) == 7' report.json
